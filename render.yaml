services:
  # ─── NestJS Backend ───────────────────────────────────────────────────────
  - type: web
    name: industrial-nexus-api
    env: node
    rootDir: apps/backend
    buildCommand: npm install && npm run build && npx prisma generate
    startCommand: npm run start:prod
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: industrial-nexus-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: industrial-nexus-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000

  # ─── Admin PWA ────────────────────────────────────────────────────────────
  - type: web
    name: industrial-nexus-admin
    env: node
    rootDir: apps/admin-pwa
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://industrial-nexus-api.onrender.com
      - key: NEXT_PUBLIC_WS_URL
        value: https://industrial-nexus-api.onrender.com
      - key: PORT
        value: 10000

  # ─── Client PWA ───────────────────────────────────────────────────────────
  - type: web
    name: industrial-nexus-client
    env: node
    rootDir: apps/client-pwa
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://industrial-nexus-api.onrender.com
      - key: NEXT_PUBLIC_WS_URL
        value: https://industrial-nexus-api.onrender.com
      - key: PORT
        value: 10000

  # ─── Driver PWA ───────────────────────────────────────────────────────────
  - type: web
    name: industrial-nexus-driver
    env: node
    rootDir: apps/driver-pwa
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://industrial-nexus-api.onrender.com
      - key: NEXT_PUBLIC_WS_URL
        value: https://industrial-nexus-api.onrender.com
      - key: PORT
        value: 10000

databases:
  - name: industrial-nexus-db
    plan: starter

redis:
  - name: industrial-nexus-redis
    plan: starter
