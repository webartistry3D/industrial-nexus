services:
  - type: web
    name: industrial-nexus-api
    env: node
    buildCommand: npm install && cd apps/backend && npm install && npm run build && npx prisma generate
    startCommand: cd apps/backend && node dist/src/main
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_ENABLED
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: https://industrial-nexus-admin.onrender.com,https://industrial-nexus-client.onrender.com,https://industrial-nexus-driver.onrender.com

  - type: web
    name: industrial-nexus-admin
    env: node
    buildCommand: npm install && cd apps/admin-pwa && npm install && npm run build
    startCommand: cd apps/admin-pwa && npm run start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://industrial-nexus-api.onrender.com
      - key: NEXT_PUBLIC_WS_URL
        value: https://industrial-nexus-api.onrender.com

  - type: web
    name: industrial-nexus-client
    env: node
    buildCommand: npm install && cd apps/client-pwa && npm install && npm run build
    startCommand: cd apps/client-pwa && npm run start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://industrial-nexus-api.onrender.com
      - key: NEXT_PUBLIC_WS_URL
        value: https://industrial-nexus-api.onrender.com

  - type: web
    name: industrial-nexus-driver
    env: node
    buildCommand: npm install && cd apps/driver-pwa && npm install && npm run build
    startCommand: cd apps/driver-pwa && npm run start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://industrial-nexus-api.onrender.com
      - key: NEXT_PUBLIC_WS_URL
        value: https://industrial-nexus-api.onrender.com
