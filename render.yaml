services:
  - type: web
    name: industrial-nexus-api
    env: node
    buildCommand: cd apps/backend && npm install && npm run build && npx prisma generate
    startCommand: cd apps/backend && node dist/src/main
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: industrial-nexus-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: industrial-nexus-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production

  - type: web
    name: industrial-nexus-admin
    env: node
    buildCommand: cd apps/admin-pwa && npm install && npm run build
    startCommand: cd apps/admin-pwa && npm run start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://industrial-nexus-api.onrender.com
      - key: NEXT_PUBLIC_WS_URL
        value: https://industrial-nexus-api.onrender.com

  - type: web
    name: industrial-nexus-client
    env: node
    buildCommand: cd apps/client-pwa && npm install && npm run build
    startCommand: cd apps/client-pwa && npm run start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://industrial-nexus-api.onrender.com
      - key: NEXT_PUBLIC_WS_URL
        value: https://industrial-nexus-api.onrender.com

  - type: web
    name: industrial-nexus-driver
    env: node
    buildCommand: cd apps/driver-pwa && npm install && npm run build
    startCommand: cd apps/driver-pwa && npm run start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://industrial-nexus-api.onrender.com
      - key: NEXT_PUBLIC_WS_URL
        value: https://industrial-nexus-api.onrender.com

databases:
  - name: industrial-nexus-db
    plan: starter

redis:
  - name: industrial-nexus-redis
    plan: starter
